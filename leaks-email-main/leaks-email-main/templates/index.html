<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaks System - Portal de Acesso</title>
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-input: #111111;
            --border-color: rgba(255, 255, 255, 0.16);
            --border-focus: #ffffff;
            --primary: #ffffff;
            --primary-hover: #d4d4d4;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.035) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.035) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.018) 0%, transparent 60%);
        }

        /* Alerta Dinâmico Flutuante */
        .alert-box {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            backdrop-filter: blur(16px);
            color: #fca5a5;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .alert-box.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Contentor principal estilo grid/painel flutuante moderno */
        .leaks-wrapper {
            max-width: 460px;
            width: 100%;
            position: relative;
        }

        /* Elemento decorativo de fundo com brilho animado */
        .leaks-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28), transparent, rgba(255, 255, 255, 0.24));
            border-radius: 26px;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.7;
        }

        .main-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
            width: 100%;
        }

        /* Barra superior interna do painel (Ações rápidas) */
        .card-top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-gif {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.24);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.24);
        }

        .brand-text {
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #f5f5f5;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .btn-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #f5f5f5;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-pill:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: var(--primary);
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Textos centrais da aplicação */
        .hero-title-group {
            margin-bottom: 28px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        p.description {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
            margin: 0;
        }

        /* Formulário com estilo dinâmico */
        .form-group {
            margin-bottom: 18px;
        }

        .input-label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #d4d4d4;
        }

        .form-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 13px 16px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06), inset 0 0 10px rgba(255, 255, 255, 0.025);
            background-color: #181818;
        }

        .form-input::placeholder {
            color: #737373;
        }

        /* Botão de Ação Principal Dinâmico com Gradiente de Alta Intensidade */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #bdbdbd 100%);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.28);
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-submit:hover::after {
            left: 100%;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #d4d4d4 100%, #a3a3a3 100%);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Rodapé Minimalista */
        footer {
            margin-top: 25px;
            text-align: center;
            color: #737373;
            font-size: 12px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <!-- Alerta Flutuante Dinâmico -->
    <div id="notificationAlert" class="alert-box">
        <span id="notificationText">Erro ao autenticar credenciais</span>
    </div>

    <div class="leaks-wrapper">
        <div class="main-card">
            <!-- Barra superior moderna dentro do cartão -->
            <div class="card-top-nav">
                <div class="logo-area">
                    <img src="{{ url_for('static', filename='Logo.png') }}" alt="Leaks System" class="logo-gif" onerror="this.src='https://via.placeholder.com/42?text=NS'">
                    <span class="brand-text">Leaks</span>
                </div>
                <div class="nav-links">
                    <a href="/admin" class="btn-pill">Painel</a>
                    <a href="https://discord.gg/AfpqU7rbhV" target="_blank" class="btn-pill">Discord</a>
                </div>
            </div>

            <!-- Título e Descrição -->
            <div class="hero-title-group">
                <h1>Aceder à Caixa de Entrada</h1>
                <p class="description">Entra com o e-mail e a senha da tua conta DuckMail.</p>
            </div>

            <!-- Formulário de Login -->
            <form action="/client-login" method="POST">
                <div class="form-group">
                    <div class="input-label-row">
                        <span>Endereço de E-mail</span>
                    </div>
                    <input type="email" name="email" class="form-input" placeholder="utilizador@leaksemail.shop" required autocomplete="username">
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <div class="input-label-row">
                        <span>Senha</span>
                    </div>
                    <input type="password" name="password" class="form-input" placeholder="Digite sua senha DuckMail" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-submit">Abrir Caixa de Entrada</button>
            </form>
        </div>
    </div>

    <footer>
        Todos os direitos reservados • Leaks System
    </footer>

    <script>
        // Função do Alerta Dinâmico Fluido
        function showNotification(message) {
            const alertBox = document.getElementById('notificationAlert');
            const alertText = document.getElementById('notificationText');
            
            alertText.textContent = message;
            alertBox.classList.add('show');

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 3500);
        }

        // Leitor automático de erros via parâmetros GET na URL
        const urlParams = new URLSearchParams(window.location.search);
        const errorMsg = urlParams.get('error');
        const successMsg = urlParams.get('msg');
        
        if (errorMsg) {
            showNotification(decodeURIComponent(errorMsg));
            window.history.replaceState({}, document.title, window.location.pathname);
        } else if (successMsg) {
            showNotification(decodeURIComponent(successMsg));
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
