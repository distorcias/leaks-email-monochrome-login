<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaks System - {{ subject }}</title>
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-input: #111111;
            --border-color: rgba(255, 255, 255, 0.16);
            --border-focus: #ffffff;
            --primary: #ffffff;
            --primary-hover: #d4d4d4;
            --danger: rgba(239, 68, 68, 0.15);
            --danger-border: rgba(239, 68, 68, 0.4);
            --danger-text: #fca5a5;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --content-bg: #0b1120;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 25px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.035) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.035) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.018) 0%, transparent 60%);
        }

        /* Alerta Dinâmico Flutuante */
        .alert-box {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            backdrop-filter: blur(16px);
            color: #fca5a5;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .alert-box.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Wrapper Principal */
        .leaks-dashboard-wrapper {
            max-width: 720px;
            width: 100%;
            position: relative;
        }

        .leaks-dashboard-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28), transparent, rgba(255, 255, 255, 0.24));
            border-radius: 26px;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.7;
        }

        /* Cabeçalho Interno */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-gif {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.24);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.24);
        }

        .brand-text {
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #f5f5f5;
            text-transform: uppercase;
        }

        .btn-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #f5f5f5;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-pill:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: var(--primary);
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Cartão Central */
        .main-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
            width: 100%;
        }

        h3 {
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 12px 0;
            word-break: break-word;
            letter-spacing: -0.3px;
            line-height: 1.4;
        }

        .sender-info {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
            word-break: break-all;
        }

        .sender-info strong {
            color: #f5f5f5;
            font-weight: 600;
        }

        .divider {
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin: 22px 0;
        }

        /* Área do corpo da mensagem */
        .message-body {
            padding: 24px;
            font-size: 14px;
            line-height: 1.7;
            color: #f5f5f5;
            background: var(--content-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            overflow-x: auto;
            word-break: break-word;
        }

        .message-body img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #ffffff 0%, #bdbdbd 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.24);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-back:hover {
            background: linear-gradient(135deg, #d4d4d4 100%, #a3a3a3 100%);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        .btn-back:active {
            transform: translateY(1px);
        }

        footer {
            margin-top: 25px;
            text-align: center;
            color: #737373;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        @media (min-width: 500px) {
            .btn-back {
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div id="notificationAlert" class="alert-box">
        <span id="notificationText">Aviso do sistema</span>
    </div>

    <div class="leaks-dashboard-wrapper">
        <div class="main-card">
            <!-- Cabeçalho Interno -->
            <div class="dashboard-header">
                <div class="logo-area">
                    <img src="{{ url_for('static', filename='Logo.png') }}" alt="Leaks System" class="logo-gif" onerror="this.src='https://via.placeholder.com/42?text=NS'">
                    <span class="brand-text">Leaks System</span>
                </div>
                <div class="header-actions">
                    <a href="/mailbox/{{ email }}" class="btn-pill">Voltar à Caixa</a>
                </div>
            </div>

            <h3>{{ subject }}</h3>
            <p class="sender-info"><strong>De:</strong> {{ sender }}</p>
            
            <hr class="divider">
            
            <div class="message-body">
                {{ html_content | safe }}
            </div>
            
            <hr class="divider">
            
            <a href="/mailbox/{{ email }}" class="btn-back">← Voltar à Caixa de Correio</a>
        </div>
    </div>

    <footer>
        Todos os direitos reservados • Leaks System
    </footer>

    <script>
        function showNotification(message) {
            const alertBox = document.getElementById('notificationAlert');
            const alertText = document.getElementById('notificationText');
            
            alertText.textContent = message;
            alertBox.classList.add('show');

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 3500);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const errorMsg = urlParams.get('error');
        const successMsg = urlParams.get('msg');
        
        if (errorMsg) {
            showNotification(decodeURIComponent(errorMsg));
            window.history.replaceState({}, document.title, window.location.pathname + window.location.search.replace(/[\?&]error=[^&]+/, ''));
        } else if (successMsg) {
            showNotification(decodeURIComponent(successMsg));
            window.history.replaceState({}, document.title, window.location.pathname + window.location.search.replace(/[\?&]msg=[^&]+/, ''));
        }
    </script>
</body>
</html>
